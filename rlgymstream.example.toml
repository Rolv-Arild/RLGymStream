# RLGymStream configuration
# Copy this file to rlgymstream.toml and edit the paths below.
# See README.md for full documentation.

overlay_port = 8080
post_match_delay = 15
pre_match_delay = 15
leaderboard_delay = 15
sigma_priority_chance = 0.1   # chance to force the most uncertain bot into a match (0.0–1.0)
mercy_goal_diff = 8           # end match early if goal difference reaches this

# Modes to rotate through.  Options: "1v1", "2v2", "3v3", "solo_2v2", "solo_3v3"
mode_rotation = ["1v1", "2v2", "3v3", "solo_2v2", "solo_3v3"]

# ── Bot Sources ──────────────────────────────────────────────────────
# Each [[bot_sources]] points to a directory containing bot configs.
#
# If "bots" is set, each entry is a relative path to a .toml file
# (e.g. "necto/bot.toml" or "ripple/v1.bot.toml").
#
# If "bots" is omitted, every *bot.toml file under "path" is discovered
# recursively. Use "exclude" to skip certain folder names.

# Example: explicitly list bots
# [[bot_sources]]
# path = "/path/to/your/bots"
# bots = [
#     "my_bot/bot.toml",
#     "another_bot/v1.bot.toml",
# ]

# Example: auto-discover bots in a directory, excluding some folders
# [[bot_sources]]
# path = "/path/to/community-bots"
# exclude = ["broken_bot", "deprecated"]

# ── Anchored Ratings ─────────────────────────────────────────────────
# Fix a bot's mu and sigma so they never change. The bot still
# participates in matches and opponents are rated against it normally.
# Useful as a calibration reference point. Bypasses minimum sigma.
#
# Omit "modes" to anchor in all modes, or list specific ones.
# Use multiple entries for the same bot to set different ratings per mode.

# Example: anchor in all modes
# [[anchored_ratings]]
# bot_name = "Nexto"
# mu = 30.5
# sigma = 3.0

# Example: different ratings per mode
# [[anchored_ratings]]
# bot_name = "Nexto"
# mu = 30.5
# sigma = 3.0
# modes = ["1v1"]
#
# [[anchored_ratings]]
# bot_name = "Nexto"
# mu = 32.0
# sigma = 2.5
# modes = ["2v2", "3v3"]

# ── Twitch Chatbot ───────────────────────────────────────────────────
# Connect a chatbot to Twitch chat that responds to viewer commands
# like !mmr, !lb, !match, !h2h, !bot, !stats, !winrate.
# Leave channel empty to disable the chatbot.
#
# Requires a Twitch application registered at https://dev.twitch.tv/console
# You need client_id, client_secret, and the bot account's user ID (bot_id).
# Generate a user token at https://twitchtokengenerator.com with
# user:read:chat + user:write:chat scopes.
# Prefer setting credentials via environment variables.

# [twitch]
# channel = "rlgym"
# client_id = ""             # from Twitch Developer Console
# client_secret = ""         # from Twitch Developer Console
# bot_id = ""                # numeric user ID of the bot account
# token = ""                 # user access token for the bot account

