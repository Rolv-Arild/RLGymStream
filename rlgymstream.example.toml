# RLGymStream configuration
# Copy this file to rlgymstream.toml and edit the paths below.
# See README.md for full documentation.

overlay_port = 8080
post_match_delay = 15
celebration_delay = 5
pre_match_delay = 15
leaderboard_delay = 15
sigma_priority_chance = 0.1   # chance to force the most uncertain bot into a match (0.0–1.0)
settled_botpack_weight = 1.0  # featured-bot weight for RLBot botpack bots at minimum σ (0 = never featured)
mercy_goal_diff = 8           # end match early if goal difference reaches this

# Standard-mode matchmaking: Temperature-Controlled Active Learning
# n_prior: weight of the OpenSkill prior in the Beta distribution (higher = trust ratings more)
# temperature: exploration/exploitation dial (1.0 = proportional, <1 = greedy, >1 = random)
matchmaker_n_prior = 1.0
matchmaker_temperature = 1.0

# Solo-queue matchmaking: draws random candidate matchups and picks one
# weighted by how much its result would teach the ratings.
# temperature: lower = closer, less varied matchups (0.25 = a good mix)
# candidates: matchups scored per pick (more = closer to the ideal weighting)
solo_matchmaker_temperature = 0.25
solo_matchmaker_candidates = 3000

# Modes to rotate through.  Options: "1v1", "2v2", "3v3", "solo_2v2", "solo_3v3"
mode_rotation = ["1v1", "2v2", "3v3", "solo_2v2", "solo_3v3"]

# ── Bot Sources ──────────────────────────────────────────────────────
# Each [[bot_sources]] points to a directory containing bot configs.
#
# If "bots" is set, each entry is a relative path to a .toml file
# (e.g. "necto/bot.toml" or "ripple/v1.bot.toml").
#
# If "bots" is omitted, every *bot.toml file under "path" is discovered
# recursively. Use "exclude" to skip certain folder names.
#
# Set "rlbot_botpack = true" on a source that is the public RLBot botpack.
# Its bots get the RLBot icon on the overlay, telling viewers they can
# download and play against them locally.

# Example: explicitly list bots
# [[bot_sources]]
# path = "/path/to/your/bots"
# bots = [
#     "my_bot/bot.toml",
#     "another_bot/v1.bot.toml",
# ]

# Example: auto-discover bots in a directory, excluding some folders
# [[bot_sources]]
# path = "/path/to/community-bots"
# exclude = ["broken_bot", "deprecated"]

# Example: bots from the RLBot botpack installed by the RLBot app
# [[bot_sources]]
# path = "C:/Users/<you>/AppData/Local/RLBot5/bots/bob_build_x86_64-windows"
# bots = ["Nexto/bot.toml", "Necto/bot.toml"]
# rlbot_botpack = true

# ── Anchored Ratings ─────────────────────────────────────────────────
# Fix a bot's mu and sigma so they never change. The bot still
# participates in matches and opponents are rated against it normally.
# Useful as a calibration reference point. Bypasses minimum sigma.
#
# Omit "modes" to anchor in all modes, or list specific ones.
# Use multiple entries for the same bot to set different ratings per mode.

# Example: anchor in all modes
# [[anchored_ratings]]
# bot_name = "Nexto"
# mu = 30.5
# sigma = 3.0

# Example: different ratings per mode
# [[anchored_ratings]]
# bot_name = "Nexto"
# mu = 30.5
# sigma = 3.0
# modes = ["1v1"]
#
# [[anchored_ratings]]
# bot_name = "Nexto"
# mu = 32.0
# sigma = 2.5
# modes = ["2v2", "3v3"]

# ── Bot Overrides ────────────────────────────────────────────────────
# Override metadata from a bot's bot.toml, keyed by bot name. Useful for
# bots you don't control (e.g. the RLBot botpack). "tags" replaces
# [details].tags, with the same vocabulary: "1v1", "2v2", "3v3", and
# "teamplay" (2v2 + 3v3). The stream won't start if a bot has no mode
# tags; add them here. Also use this for a "teamplay" bot that can't
# play both 2v2 and 3v3.
# Restart to apply; overrides naming a missing bot log a warning.
#
# [bot_overrides."Dice"]
# tags = ["1v1", "2v2"]

# ── Twitch Chatbot ───────────────────────────────────────────────────
# Connect a chatbot to Twitch chat that responds to viewer commands
# like !mmr, !lb, !match, !h2h, !bot, !stats, !winrate.
# Leave channel empty to disable the chatbot.
#
# 1. Register an app at https://dev.twitch.tv/console
#    Set OAuth callback to: http://localhost:4343/oauth/callback
# 2. Fill in client_id, client_secret, and channel below.
#    bot_id and owner_id are optional — if omitted, they default to the channel's user ID.
# 3. Start the app, then authorize ONCE in your browser:
#    - Log in as the bot account:  http://localhost:4343/oauth?scopes=user:read:chat+user:write:chat+user:bot&force_verify=true
#    - Log in as channel owner:    http://localhost:4343/oauth?scopes=channel:bot&force_verify=true
#    (If the bot IS the channel, just do both URLs while logged in as that account.)
# Tokens are saved to .tio.tokens.json and refreshed automatically.

# [twitch]
# channel = "rlgym"
# client_id = ""             # from Twitch Developer Console
# client_secret = ""         # from Twitch Developer Console
# bot_id = ""                # optional: numeric user ID of bot account (defaults to channel)
# owner_id = ""              # optional: numeric user ID of channel owner (defaults to channel)

# ── Psyonix Stats API ───────────────────────────────────────────────
# The Stats API broadcasts live game data over a local websocket.
# To enable it, edit <RL Install Dir>\TAGame\Config\DefaultStatsAPI.ini:
#   PacketSendRate=10     (number of UpdateState packets per second, max 120)
#   Port=49123            (websocket port)
# Then restart Rocket League. The overlay will show live boost bars,
# speed indicators, stat counters, event ticker, and postgame analytics.

# stats_api_port = 49123   # must match the Port in DefaultStatsAPI.ini
# stats_api_rate = 120      # recommended PacketSendRate in DefaultStatsAPI.ini (max 120)

