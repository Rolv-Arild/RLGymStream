# RLGymStream configuration
# Copy this file to rlgymstream.toml and edit the paths below.
# See README.md for full documentation.

overlay_port = 8080
post_match_delay = 15
pre_match_delay = 15
leaderboard_delay = 15
sigma_priority_chance = 0.1   # chance to force the most uncertain bot into a match (0.0–1.0)
mercy_goal_diff = 8           # end match early if goal difference reaches this

# Modes to rotate through.  Options: "1v1", "2v2", "3v3", "solo_2v2", "solo_3v3"
mode_rotation = ["1v1", "2v2", "3v3", "solo_2v2", "solo_3v3"]

# ── Bot Sources ──────────────────────────────────────────────────────
# Each [[bot_sources]] points to a directory containing bot configs.
#
# If "bots" is set, each entry is a relative path to a .toml file
# (e.g. "necto/bot.toml" or "ripple/v1.bot.toml").
#
# If "bots" is omitted, every *bot.toml file under "path" is discovered
# recursively. Use "exclude" to skip certain folder names.

# Example: explicitly list bots
# [[bot_sources]]
# path = "/path/to/your/bots"
# bots = [
#     "my_bot/bot.toml",
#     "another_bot/v1.bot.toml",
# ]

# Example: auto-discover bots in a directory, excluding some folders
# [[bot_sources]]
# path = "/path/to/community-bots"
# exclude = ["broken_bot", "deprecated"]

