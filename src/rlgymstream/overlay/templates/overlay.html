<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RLGymStream</title>
    <link rel="stylesheet" href="/static/styles.css?v=4">
    <style>
        /* Badge cards for live in-game display */
        .badge-card {
            background: rgba(12, 6, 22, 0.8);
            border-radius: 10px;
            padding: 12px 20px;
            min-width: 140px;
        }
        .badge-card.blue   { border-left: 3px solid #3b82f6; }
        .badge-card.orange { border-right: 3px solid #f97316; text-align: right; }
        .badge-name { font-size: 20px; font-weight: 600; color: #f0f0f0; font-family: 'Poppins', sans-serif; }
        .badge-mmr { font-family: 'Orbitron', sans-serif; font-size: 28px; color: #fbbf24; line-height: 1; }
        .badge-mmr-label { font-size: 10px; color: #b8a8c8; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
        .badge-count { font-size: 14px; color: #b8a8c8; font-weight: 400; }
        .badge-delta-pos { font-size: 16px; color: #4ade80; font-weight: 600; margin-left: 6px; }
        .badge-delta-neg { font-size: 16px; color: #f87171; font-weight: 600; margin-left: 6px; }
        .anchored-icon { font-size: 0.65em; color: #94a3b8; margin-left: 4px; vertical-align: middle; cursor: default; }
    </style>
</head>
<body>
<!--
  Single 1920×1080 OBS Browser Source overlay.
  - pregame:  full-screen bot showcase (descriptions, fun facts, MMR, H2H, win probability)
  - live:     minimal badges in top-left/top-right (avoids game UI)
  - postgame: badges with MMR gain/loss deltas (game shows its own scoreboard)
  - idle:     leaderboard between matches
-->
<div id="overlay">
    <!-- pre-match: full-screen showcase -->
    <div id="pregame" class="phase-layer" style="display:none"></div>

    <!-- live: blue bots stacked on left, orange bots stacked on right -->
    <div id="live-blue" style="display:none; position:absolute; top:16px; left:16px; flex-direction:column; gap:8px; z-index:10;"></div>
    <div id="live-orange" style="display:none; position:absolute; top:16px; right:16px; flex-direction:column; gap:8px; z-index:10;"></div>

    <!-- idle: leaderboard display between matches -->
    <div id="idle-leaderboard" class="phase-layer" style="display:none"></div>
</div>

<script src="/static/overlay.js?v=3"></script>
<script>
let _currentPhase = null;
const FADE_MS = 300;

const _layers = {};

function _initLayers() {
    _layers.pregame    = document.getElementById("pregame");
    _layers.liveBlue   = document.getElementById("live-blue");
    _layers.liveOrange = document.getElementById("live-orange");
    _layers.idle       = document.getElementById("idle-leaderboard");
    for (const el of Object.values(_layers)) {
        el.style.transition = `opacity ${FADE_MS}ms ease`;
        el.style.opacity = "0";
    }
}

function _showLayer(el, displayValue) {
    el.style.display = displayValue;
    void el.offsetHeight;
    el.style.opacity = "1";
}

function _hideLayer(el) {
    el.style.opacity = "0";
    el.style.display = "none";
}

// Phase group key (countdown/live/replay/postgame all show badges)
function _phaseGroup(phase) {
    if (phase === "countdown" || phase === "live" || phase === "replay" || phase === "postgame") return "live";
    return phase;
}

// Full-screen phases that must crossfade without showing background
const _fullScreenPhases = new Set(["pregame", "idle"]);

function _getLayersForGroup(group) {
    if (group === "pregame") return [_layers.pregame];
    if (group === "live")    return [_layers.liveBlue, _layers.liveOrange];
    if (group === "idle")    return [_layers.idle];
    return [];
}

window.renderState = function(state) {
    const m = state.match;
    if (!_layers.pregame) _initLayers();

    const newGroup = _phaseGroup(m.phase);

    if (newGroup === _currentPhase) {
        // Same phase — just update content, no transition
        _updateContent(m, state);
        return;
    }

    const oldGroup = _currentPhase;
    _currentPhase = newGroup;

    // Render new content first (while still hidden or behind old layer)
    _updateContent(m, state);

    const oldLayers = _getLayersForGroup(oldGroup);
    const newLayers = _getLayersForGroup(newGroup);

    // If both old and new are full-screen, crossfade:
    // show new underneath at full opacity, then fade old out on top.
    if (_fullScreenPhases.has(oldGroup) && _fullScreenPhases.has(newGroup)) {
        // Show new layer immediately at full opacity (underneath via z-order)
        for (const el of newLayers) {
            el.style.transition = "none";
            el.style.display = "flex";
            el.style.opacity = "1";
            el.style.zIndex = "1";
        }
        // Old layer stays visible on top, then fades out
        for (const el of oldLayers) {
            el.style.zIndex = "2";
            el.style.transition = `opacity ${FADE_MS}ms ease`;
        }
        void document.body.offsetHeight; // force reflow
        for (const el of oldLayers) {
            el.style.opacity = "0";
        }
        setTimeout(() => {
            for (const el of oldLayers) _hideLayer(el);
            // Reset z-index
            for (const el of [...oldLayers, ...newLayers]) el.style.zIndex = "";
            // Re-enable transition on new layers
            for (const el of newLayers) el.style.transition = `opacity ${FADE_MS}ms ease`;
        }, FADE_MS);
    } else {
        // Non-full-screen transition (e.g. live→postgame, pregame→live)
        // Fade out old, then show new
        let anyVisible = false;
        for (const el of oldLayers) {
            if (el.style.display !== "none" && el.style.opacity !== "0") {
                el.style.transition = `opacity ${FADE_MS}ms ease`;
                el.style.opacity = "0";
                anyVisible = true;
            }
        }
        const showNew = () => {
            for (const el of oldLayers) _hideLayer(el);
            for (const el of newLayers) _showLayer(el, "flex");
        };
        if (anyVisible) {
            setTimeout(showNew, FADE_MS);
        } else {
            for (const el of Object.values(_layers)) _hideLayer(el);
            for (const el of newLayers) _showLayer(el, "flex");
        }
    }
};

function _updateContent(m, state) {
    if (_phaseGroup(m.phase) === "pregame") {
        renderPregame(m, state, _layers.pregame);
    } else if (_phaseGroup(m.phase) === "live") {
        renderLiveBadges(m);
    } else if (_phaseGroup(m.phase) === "idle") {
        renderIdleLeaderboard(state, _layers.idle);
    }
}

/* ══════════════════════════════════════════════════════════════
   PRE-GAME — full showcase
   ══════════════════════════════════════════════════════════════ */
function renderPregame(m, state, el) {
    const h2h = state.head_to_head || {};
    const isSolo = m.mode && m.mode.startsWith("solo_");

    // Build bot showcase cards
    const blueCards = m.team_blue.map(b => botShowcase(b, "blue", isSolo)).join("");
    const orangeCards = m.team_orange.map(b => botShowcase(b, "orange", isSolo)).join("");

    // H2H section (meaningful for standard modes with single bot type per team)
    const blueNames = new Set(m.team_blue.map(b => b.name));
    const orangeNames = new Set(m.team_orange.map(b => b.name));
    const isBotVsBot = blueNames.size === 1 && orangeNames.size === 1;
    let h2hHtml = "";
    if (!isSolo && h2h.total > 0 && isBotVsBot) {
        const wa = h2h.wins_a || 0, wb = h2h.wins_b || 0, d = h2h.draws || 0;
        const total = h2h.total;
        const pA = (wa/total*100).toFixed(0), pD = (d/total*100).toFixed(0), pB = (wb/total*100).toFixed(0);
        h2hHtml = `
        <div class="pre-h2h">
            <div class="pre-h2h-title">Head to Head — ${total} meetings</div>
            <div class="pre-h2h-bar">
                ${wa > 0 ? `<div class="h2h-seg blue" style="width:${pA}%">${wa}W</div>` : ""}
                ${d > 0 ? `<div class="h2h-seg draw" style="width:${pD}%">${d}D</div>` : ""}
                ${wb > 0 ? `<div class="h2h-seg orange" style="width:${pB}%">${wb}W</div>` : ""}
            </div>
        </div>`;
    } else if (!isSolo && isBotVsBot && h2h.bot_a_name) {
        h2hHtml = `<div class="pre-h2h"><div class="pre-h2h-title">First meeting!</div></div>`;
    }

    // Win probability bar
    let winProbHtml = "";
    const wp = m.win_probabilities || [];
    if (wp.length === 2) {
        const pBlue = (wp[0] * 100).toFixed(0);
        const pOrange = (wp[1] * 100).toFixed(0);
        winProbHtml = `
        <div class="pre-h2h">
            <div class="pre-h2h-title">Estimated Win Probability</div>
            <div class="pre-h2h-bar">
                <div class="h2h-seg blue" style="width:${pBlue}%">${pBlue}%</div>
                <div class="h2h-seg orange" style="width:${pOrange}%">${pOrange}%</div>
            </div>
        </div>`;
    }

    el.innerHTML = `
        <div class="pre-container">
            <div class="pre-header">
                <img class="pre-header-logo" src="/static/rlgym.png" alt="">
                <div class="pre-mode">${escapeHtml(m.mode_display)}</div>
                <div class="pre-map">${escapeHtml(m.map_name)}</div>
                <div class="pre-match-num">Match #${m.match_number}</div>
            </div>
            <div class="pre-teams">
                <div class="pre-team blue">
                    <div class="pre-team-label">BLUE</div>
                    ${blueCards}
                </div>
                <div class="pre-vs">VS</div>
                <div class="pre-team orange">
                    <div class="pre-team-label">ORANGE</div>
                    ${orangeCards}
                </div>
            </div>
            ${h2hHtml}
            ${winProbHtml}
            <div class="pre-disclaimer">Bot MMR — does not reflect actual in-game rank · Pinned ratings are based on estimates of human MMR</div>
        </div>`;
}

function botShowcase(bot, team, isSolo) {
    const desc = bot.description || "";
    const fact = bot.fun_fact ? `<div class="pre-bot-fact">💡 ${escapeHtml(bot.fun_fact)}</div>` : "";
    const lang = bot.language ? `<span class="pre-bot-lang">${escapeHtml(bot.language)}</span>` : "";
    const record = isSolo
        ? `${bot.matches_played} game${bot.matches_played !== 1 ? "s" : ""}`
        : (bot.matches_played > 0 ? `${bot.wins}W-${bot.losses}L` : "No games");
    const logo = bot.logo_path
        ? `<img class="pre-bot-logo" src="/api/logo/${bot.id}" alt="">`
        : "";
    return `<div class="pre-bot ${team}">
        ${logo}
        <div class="pre-bot-content">
            <div class="pre-bot-header">
                <div>
                    <div class="pre-bot-name">${escapeHtml(bot.name)}</div>
                    <div class="pre-bot-author">by ${escapeHtml(bot.author || "Unknown")} ${lang}</div>
                </div>
                <div class="pre-bot-mmr-box">
                    <div class="pre-bot-mmr">${anchorIcon(bot)}${formatMMR(bot.mmr)}</div>
                    <div class="pre-bot-mmr-sub">MMR · ${record}</div>
                </div>
            </div>
            ${desc ? `<div class="pre-bot-desc">${escapeHtml(desc)}</div>` : ""}
            ${fact}
        </div>
    </div>`;
}

/* ══════════════════════════════════════════════════════════════
   LIVE — tiny corner badges (avoid game UI)
   ══════════════════════════════════════════════════════════════ */
function renderLiveBadges(m) {
    const blueEl = document.getElementById("live-blue");
    const orangeEl = document.getElementById("live-orange");
    const isSolo = m.mode && m.mode.startsWith("solo_");
    const deltas = m.mmr_deltas || {};
    blueEl.innerHTML = buildBadgeCards(m.team_blue, "blue", isSolo, deltas);
    orangeEl.innerHTML = buildBadgeCards(m.team_orange, "orange", isSolo, deltas);
}

function buildBadgeCards(team, teamClass, expandAll, deltas) {
    if (expandAll) {
        // Solo queue: show each bot individually, no grouping
        return team.map(b => {
            const deltaHtml = _deltaHtml(deltas, b.id);
            return `<div class="badge-card ${teamClass}">
                <div class="badge-name">${escapeHtml(b.name)}</div>
                <div class="badge-mmr">${formatMMR(b.mmr)}${deltaHtml}</div>
                <div class="badge-mmr-label">MMR</div>
            </div>`;
        }).join("");
    }
    // Standard modes: group duplicate bots (same name) into "BotName ×N"
    const grouped = [];
    const seen = {};
    for (const b of team) {
        if (seen[b.name]) { seen[b.name].count++; }
        else { seen[b.name] = { bot: b, count: 1 }; grouped.push(seen[b.name]); }
    }
    return grouped.map(g => {
        const b = g.bot;
        const suffix = g.count > 1 ? ` <span class="badge-count">×${g.count}</span>` : "";
        const deltaHtml = _deltaHtml(deltas, b.id);
        return `<div class="badge-card ${teamClass}">
            <div class="badge-name">${escapeHtml(b.name)}${suffix}</div>
            <div class="badge-mmr">${formatMMR(b.mmr)}${deltaHtml}</div>
            <div class="badge-mmr-label">MMR</div>
        </div>`;
    }).join("");
}

function _deltaHtml(deltas, botId) {
    if (!deltas || !(botId in deltas)) return "";
    const d = deltas[botId];
    if (d === 0) return "";
    const cls = d > 0 ? "badge-delta-pos" : "badge-delta-neg";
    const sign = d > 0 ? "+" : "";
    return ` <span class="${cls}">${sign}${d}</span>`;
}


/* ══════════════════════════════════════════════════════════════
   IDLE — all-modes leaderboard on one page
   ══════════════════════════════════════════════════════════════ */
let _lbCurrentVersion = -1;

function renderIdleLeaderboard(state, el) {
    const boards = state.leaderboards || {};
    const modes = Object.keys(boards).filter(mk => {
        const entries = boards[mk] || [];
        return entries.some(e => e.matches_played > 0);
    });
    if (modes.length === 0) { el.innerHTML = ""; _lbCurrentVersion = -1; return; }

    const version = state.version || 0;
    if (version === _lbCurrentVersion) return;
    _lbCurrentVersion = version;

    const modeLabels = {
        "1v1": "1v1", "2v2": "2v2", "3v3": "3v3",
        "solo_2v2": "Solo 2v2", "solo_3v3": "Solo 3v3"
    };
    const totalMatches = state.total_matches || 0;

    const columns = modes.map(mk => {
        const entries = boards[mk] || [];
        const label = modeLabels[mk] || mk;
        const rows = entries.map((e, i) => {
            const r = i + 1;
            const rc = rankClass(r);
            return `<div class="idle-lb-row">
                <div class="idle-lb-rank ${rc}">#${r}</div>
                <div class="idle-lb-info">
                    <div class="idle-lb-name">${escapeHtml(e.bot_name)}</div>
                    <div class="idle-lb-games">${e.matches_played} game${e.matches_played !== 1 ? "s" : ""}</div>
                </div>
                <div class="idle-lb-mmr">${anchorIcon(e)}${formatMMR(e.mmr)}</div>
            </div>`;
        }).join("");

        return `<div class="idle-lb-col">
            <div class="idle-lb-col-title">${escapeHtml(label)}</div>
            <div class="idle-lb-col-body">
                ${rows || '<div class="idle-lb-empty">No games yet</div>'}
            </div>
        </div>`;
    }).join("");

    el.innerHTML = `
        <div class="idle-lb-container">
            <div class="idle-lb-header">
                <img class="idle-lb-logo" src="/static/rlgym.png" alt="">
                <div class="idle-lb-title">LEADERBOARD</div>
            </div>
            <div class="idle-lb-columns">
                ${columns}
            </div>
            <div class="idle-lb-footer">
                ${totalMatches} match${totalMatches !== 1 ? "es" : ""} played · Bot MMR — does not reflect actual in-game rank · Pinned ratings are based on estimates of human MMR
            </div>
        </div>`;
}


/* ── Utilities ─────────────────────────────────────────────── */
function anchorIcon(obj) {
    return obj && obj.anchored ? '<span class="anchored-icon" title="Anchored — rating does not change">📌&ensp;</span>' : "";
}
function trunc(s, max) {
    if (!s) return "";
    s = s.replace(/\s+/g, " ").trim();
    return s.length > max ? s.slice(0, max).trim() + "…" : s;
}
</script>
</body>
</html>
