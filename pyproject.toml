[project]
name = "rlgymstream"
version = "0.1.0"
description = "Twitch stream platform for RLBot v5 Rocket League bot competitions"
requires-python = ">=3.12"
dependencies = [
    "rlbot==2.0.0b52",
    "openskill>=6.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "sse-starlette>=2.0.0",
    "matplotlib>=3.10.8",
    "twitchio>=3.2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
rlgymstream = "rlgymstream.main:main"
rlgymstream-chat = "rlgymstream.chat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
